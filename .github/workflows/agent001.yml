name: AGENT-001 paper trading

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: agent001-paper
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run paper-trading cycle
        run: python3 agent001.py

      - name: Persist state and dashboard
        run: |
          git config user.name "agent001-bot"
          git config user.email "agent001-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to persist."
          else
            git commit -m "AGENT-001 cycle $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
