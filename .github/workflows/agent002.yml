name: AGENT-002 profit hunter paper trading

on:
  workflow_dispatch:
  schedule:
    - cron: "14,29,44,59 * * * *"

permissions:
  contents: write

concurrency:
  group: paper-trading-repo-writes
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Snapshot dashboard state
        run: python3 dashboard_enhancer.py pre 002

      - name: Run AGENT-002 cycle
        run: python3 agent002.py

      - name: Build rich dashboard
        run: python3 dashboard_enhancer.py post 002

      - name: Persist AGENT-002 state and dashboard
        run: |
          git config user.name "agent002-bot"
          git config user.email "agent002-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to persist."
          else
            git commit -m "AGENT-002 cycle $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase
            git push
          fi
